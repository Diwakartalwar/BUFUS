name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (MSYS2 MinGW-w64)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ntldd

      - name: Build
        run: |
          echo "=== Toolchain info ==="
          x86_64-w64-mingw32-gcc --version
          echo "=== Building BUFUS ==="
          make clean
          make CFLAGS="-Wall -Wextra -Wpedantic -O2 -DNDEBUG"

      - name: Verify build output exists
        run: |
          ls -la ./release/bufus.exe || ls -la ./bufus.exe || find . -name "bufus.exe" -type f

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bufus-${{ github.sha }}
          path: |
            ./release/bufus.exe
            ./bufus.exe
          if-no-files-found: error

  # --- Static analysis (optional, runs in parallel) ---
  lint:
    name: Lint (cppcheck)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cppcheck
            make
            mingw-w64-x86_64-gcc

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --suppress=missingInclude \
            --suppress=unusedFunction \
            --error-exitcode=1 \
            --inline-suppr \
            .